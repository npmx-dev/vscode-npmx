shellEmulator: true
trustPolicy: no-downgrade
packages:
  - extensions/*
  - packages/*

overrides:
  vscode-jsonrpc: 9.0.1
  vscode-languageserver-protocol: 3.17.5
  vscode-languageserver-types: 3.18.0

catalogs:
  dev:
    '@types/node': ^26.6.5
    '@types/path-browserify': ^1.0.3
    '@vida0905/eslint-config': ^2.13.0
    eslint: ^10.13.0
    husky: ^9.1.7
    nano-staged: ^1.0.2
    tsdown: ^0.23.2
    typescript: npm:@typescript/typescript6@^6.0.2
    typescript7: npm:typescript@^7.0.2
    vite: ^8.3.5
    vscode-ext-gen: ^1.6.0
  inline:
    fast-npm-meta: ^2.2.0
    jsonc-parser: ^3.3.1
    module-replacements: ^3.4.0
    ocache: ^0.3.1
    ofetch: ^2.0.0-alpha.3
    package-manager-detector: ^1.9.0
    path-browserify: ^1.0.1
    reactive-vscode: ^1.0.2
    verkit: ^0.5.0
    vscode-find-up: ^0.1.1
    vscode-languageserver-textdocument: ^1.0.16
    yaml: ^2.9.1
  lsp:
    '@volar/language-server': ^2.4.30
    '@volar/language-service': ^2.4.30
    '@volar/vscode': ^2.4.30
    vscode-languageserver-types: ^3.18.5
    vscode-uri: ^3.2.0
  test:
    jest-mock-vscode: ^4.13.0
    msw: ^3.0.3
    vite-tsconfig-paths: ^6.1.1
    vitest: ^5.0.5

allowBuilds:
  msw: false

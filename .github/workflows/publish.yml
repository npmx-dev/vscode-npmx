name: Publish Extensions

on:
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  publish-extension:
    permissions:
      id-token: write
      contents: write
      actions: write

    runs-on: ubuntu-slim
    steps:
      - name: Setup JS
        uses: sxzz/workflows/setup-js@dd67f194be6388e12ee61ad0cd3b81cf74bfd294
        with:
          fetch-all: true

      - name: Generate Github Changelog
        run: npx changelogithub
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Build
        run: pnpm build

      - name: Publish npm packages to registry
        run: pnpm -r --filter './packages/*' publish --access public --no-git-checks --provenance

      - name: Generate .vsix file
        working-directory: extensions/vscode
        run: pnpm package

      - name: Publish VSCode Extension
        working-directory: extensions/vscode
        run: npx vsxpub --no-dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VSCE_PAT: ${{secrets.VSCE_PAT}}
          OVSX_PAT: ${{secrets.OVSX_PAT}}

      - name: Publish Zed Extension
        uses: huacnlee/zed-extension-action@8cd592a0d24e1e41157740f1a529aeabddc88a1b # v2.0.0
        with:
          extension-name: npmx
          push-to: 9romise/zed-extensions
        env:
          COMMITTER_TOKEN: ${{ secrets.COMMITTER_TOKEN }}

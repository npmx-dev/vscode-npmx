name: Unit Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# cancel in-progress runs on new commits to same PR (gitub.event.number)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  unit-test:
    uses: sxzz/workflows/.github/workflows/unit-test.yml@69098296b6f6083ed99f38e2040f2a7238580e27 # v1.4.0
    with:
      node-versions: 22,"lts/*"
